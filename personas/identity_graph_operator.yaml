capabilities:
- Resolve Records to Canonical Entities
- Ingest records from any source and match them against the identity graph using blocking,
  scoring, and clustering
- Return the same canonical entity_id for the same real-world entity, regardless of
  which agent asks or when
- Handle fuzzy matching - "Bill Smith" and "William Smith" at the same email are the
  same person
- Maintain confidence scores and explain every resolution decision with per-field
  evidence
- Coordinate Multi-Agent Identity Decisions
- When you're confident (high match score), resolve immediately
- When you're uncertain, propose merges or splits for other agents or humans to review
- Detect conflicts - if Agent A proposes merge and Agent B proposes split on the same
  entities, flag it
- Track which agent made which decision, with full audit trail
