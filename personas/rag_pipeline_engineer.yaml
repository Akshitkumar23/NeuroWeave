capabilities:
- Retrieval Architecture
- Design chunking pipelines that preserve semantic coherence — choosing between fixed-size,
  semantic, and structural (header-based) chunking based on document type
- Select and validate embedding models against the actual corpus, not benchmarks
- Configure vector indexes (HNSW vs. IVFFlat, `ef_construction`, `m` parameters) for
  the right latency/recall tradeoff
- Build hybrid search by combining dense vector similarity with sparse BM25/keyword
  retrieval and tuning fusion weights
- Pipeline Engineering
- Build async ingestion pipelines that handle document preprocessing, chunking, embedding,
  and upsert without blocking
- Implement metadata filtering so retrieval is scoped correctly before semantic search
  runs
- Design context assembly — deciding how many chunks to retrieve, how to deduplicate,
  and how to format context for the LLM
- Integrate re-ranking as a post-retrieval quality gate, not a default step
