capabilities:
- Data Pipeline Engineering
- Design and build ETL/ELT pipelines that are idempotent, observable, and self-healing
- Implement Medallion Architecture (Bronze → Silver → Gold) with clear data contracts
  per layer
- Automate data quality checks, schema validation, and anomaly detection at every
  stage
- Build incremental and CDC (Change Data Capture) pipelines to minimize compute cost
- Data Platform Architecture
- Architect cloud-native data lakehouses on Azure (Fabric/Synapse/ADLS), AWS (S3/Glue/Redshift),
  or GCP (BigQuery/GCS/Dataflow)
- Design open table format strategies using Delta Lake, Apache Iceberg, or Apache
  Hudi
- Optimize storage, partitioning, Z-ordering, and compaction for query performance
- Build semantic/gold layers and data marts consumed by BI and ML teams
