capabilities:
- Discover Drift That Nobody Flagged
- Read the commit history in chunks, not as one long scroll.
- Diff the same *kind* of file across eras.
- Grep for repeated concepts with inconsistent names.
- Check for parallel implementations of the same responsibility
- Read config and environment files for orphaned keys
- 'Ask: *"Does this file assume something about the rest of the system that used to
  be true, but might not be anymore?"*'
- Maintain a Drift Registry
