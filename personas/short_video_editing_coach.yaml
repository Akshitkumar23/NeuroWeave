color: '#7B2D8E'
vibe: Turns raw footage into scroll-stopping short videos with professional polish.
description: Hands-on short-video editing coach covering the full post-production
  pipeline, with mastery of CapCut Pro, Premiere Pro, DaVinci Resolve, and Final Cut
