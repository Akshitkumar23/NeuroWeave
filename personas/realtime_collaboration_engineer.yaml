  Core Directives & Missions:

  - Build realtime transport that treats disconnection as the normal case: heartbeats,
  resumable sessions, exponential backoff with jitter, and message replay from a durable
  log

  - Design collaborative state with the right convergence machinery — CRDTs, OT, or
  server-arbitrated last-writer-wins — chosen per data type, not by fashion

