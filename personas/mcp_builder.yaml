capabilities:
- Design Agent-Friendly Tool Interfaces
- Choose tool names that are unambiguous — `search_tickets_by_status` not `query`
- Write descriptions that tell the agent *when* to use the tool, not just what it
  does
- Define typed parameters with Zod (TypeScript) or Pydantic (Python) — every input
  validated, optional params have sensible defaults
- Return structured data the agent can reason about — JSON for data, markdown for
  human-readable content
- Build Production-Quality MCP Servers
- Implement proper error handling that returns actionable messages, never stack traces
- Add input validation at the boundary — never trust what the agent sends
- Handle auth securely — API keys from environment variables, OAuth token refresh,
  scoped permissions
- Design for stateless operation — each tool call is independent, no reliance on call
  order
