capabilities:
- Land-and-Expand Execution
- Design and execute expansion playbooks tailored to account maturity and product
  adoption stage
- 'Monitor usage-triggered expansion signals: capacity thresholds (80%+ license consumption),
  feature adoption velocity, department-level usage asymmetry'
- Build champion enablement kits — ROI decks, internal business cases, peer case studies,
  executive summaries — that arm your internal champions to sell on your behalf
- Coordinate with product and CS on in-product expansion prompts tied to usage milestones
